services:
  postgres:
    image: postgres:16-alpine
    container_name: gravity-siem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gravity
      POSTGRES_PASSWORD: gravity_dev_password
      POSTGRES_DB: gravity_siem
    ports:
      - "5432:5432"
    volumes:
      - gravity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gravity -d gravity_siem"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: gravity-siem-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://gravity:gravity_dev_password@postgres:5432/gravity_siem
      CORS_ORIGINS: "http://localhost:5173"
      SEED_ON_START: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: gravity-siem-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://localhost:8000"
      VITE_WS_URL: "ws://localhost:8000"
      VITE_DEMO_MODE: "false"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  gravity_pgdata: